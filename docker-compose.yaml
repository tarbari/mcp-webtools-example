services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BASE_URL: "http://localhost:8080/"
      INSTANCE_NAME: "searxng-local"
    volumes:
      - /opt/searxng-config:/etc/searxng:rw

  webtools-mcp:
    image: webtools-mcp:latest
    container_name: webtools-mcp
    restart: unless-stopped
    depends_on:
      - searxng
    ports:
      - "0.0.0.0:8000:8000"

